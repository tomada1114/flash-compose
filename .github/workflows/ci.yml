name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Superseding a pull request cancels its previous run. A push to main is keyed
  # by commit instead, so two quick merges neither cancel one another nor leave
  # main's tip without a finished CI run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # `bash` runs as `bash --noprofile --norc -eo pipefail {0}`; an unnamed shell is
    # `bash -e {0}`, which misses a failure before a `|`.
    shell: bash

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # XcodeGen/xcbeautify are macOS-only; install just the Linux-capable linters here.
          # just: scripts/checks/just-recipes-exist.sh (and its tests) call it.
          install_args: swiftlint swiftformat actionlint shellcheck typos just

      - name: Lint (swiftformat, swiftlint, shellcheck, actionlint, typos, skills mirror)
        # The same script `just lint` and the pre-commit hook call. No `mise exec`:
        # mise-action already put the tools on PATH, and `mise exec` would try to
        # install the macOS-only tools this job leaves out.
        run: scripts/lint.sh

      - name: Script tests (scripts/tests/run.sh)
        # The same runner `just test-scripts` calls; needs bash, git, python3, and the
        # swiftformat, swiftlint, and just installed above.
        run: scripts/tests/run.sh

      - name: Harness checks (scripts/checks/run-all.sh)
        # The same runner `just check-harness` calls: every check under
        # scripts/checks/, each listed in AGENTS.md's Enforcement layers.
        run: scripts/checks/run-all.sh

  # This job calls scripts/coverage.sh (what `just test` runs); the app job calls the
  # just recipes itself.
  test:
    name: Test & Coverage Gate
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/select-xcode

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Run tests with coverage floor
        run: scripts/coverage.sh

  # Decides whether a pull request touches anything the simulator jobs (app, smoke,
  # ios-tests) exercise. Those jobs are required checks, so they always run and report
  # under their own names; they only skip their steps when this job says
  # `simulator=false`. A push (main) always says true.
  #
  # PAUSED until the MVP is built (the owner's call): the detection below is commented
  # out and this job always says `simulator=false`, so the simulator jobs skip every
  # step on every event. To turn them back on, delete the `echo`/`exit` pair and
  # uncomment the block under it.
  changes:
    name: Detect Simulator-Relevant Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      simulator: ${{ steps.detect.outputs.simulator }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          # Full history so the merge base of the pull request's base and head exists.
          fetch-depth: 0

      - name: Decide whether the simulator jobs have work
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # PAUSED until the MVP is built — see the job's comment.
          echo "simulator=false" >>"${GITHUB_OUTPUT}"
          exit 0
          # if [[ "${EVENT_NAME}" != "pull_request" ]]; then
          #   echo "simulator=true" >>"${GITHUB_OUTPUT}"
          #   exit 0
          # fi
          # # The paths the simulator jobs exercise, as one extended regex: anything
          # # matching sends them through in full. Keep this the only copy of the list.
          # relevant='^(App/|Packages/|LaunchUITests/|Config/|scripts/|\.github/actions/|project\.yml$|justfile$|mise\.toml$|\.xcode-version$|\.github/workflows/ci\.yml$)'
          # # The pull request's own change set (three dots: from the merge base). A
          # # failed diff fails this step, and the simulator jobs then run (see below).
          # files="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          # printf 'Changed files:\n%s\n' "${files}"
          # if [[ -n "${files}" ]] && ! grep -qE -- "${relevant}" <<<"${files}"; then
          #   echo "simulator=false" >>"${GITHUB_OUTPUT}"
          # else
          #   echo "simulator=true" >>"${GITHUB_OUTPUT}"
          # fi

  app:
    name: App Build & UI Test (iOS Simulator)
    # A pull request with nothing for this job to do skips every step, so it takes a
    # cheap Ubuntu runner instead of waiting for a macOS one; any other output
    # (true, or empty after a failed `changes`) keeps macOS.
    runs-on: ${{ needs.changes.outputs.simulator == 'false' && 'ubuntu-latest' || 'xcode-27' }}
    # Fail-safe: `!cancelled()` keeps this required job running even when `changes`
    # failed, and its steps skip only on the exact output 'false' — a failed `changes`
    # leaves the output empty, so everything runs. A job skipped outright would report
    # as passing.
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.simulator != 'false'
        with:
          persist-credentials: false

      - uses: ./.github/actions/select-xcode
        if: needs.changes.outputs.simulator != 'false'

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: needs.changes.outputs.simulator != 'false'

      - name: Show the simulator the UI test will use
        if: needs.changes.outputs.simulator != 'false'
        run: scripts/simulator-destination.sh

      # Starts the cold boot (~70 s, mostly data migration) without waiting for it, so
      # it overlaps the build; the later `bootstatus -b` waits then return at once.
      # Same device the recipes pick; a device already booted is left as it is.
      - name: Boot the simulator in the background
        if: needs.changes.outputs.simulator != 'false'
        run: |
          udid="$(scripts/simulator-destination.sh --udid)"
          devices="$(xcrun simctl list devices)"
          line="$(grep -F -- "${udid}" <<<"${devices}")"
          if [[ "${line}" == *"(Booted)"* ]]; then
            echo "Simulator ${udid} is already booted."
          else
            xcrun simctl boot "${udid}"
          fi

      - name: Build app and UI tests (Debug, iOS Simulator)
        if: needs.changes.outputs.simulator != 'false'
        run: just uitest-build

      - name: Run launch UI test
        if: needs.changes.outputs.simulator != 'false'
        run: just uitest-run

      - name: Upload result bundles on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcresult-bundles
          path: build/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  smoke:
    name: Release Smoke Launch (iOS Simulator)
    # A pull request with nothing for this job to do skips every step, so it takes a
    # cheap Ubuntu runner instead of waiting for a macOS one; any other output
    # (true, or empty after a failed `changes`) keeps macOS.
    runs-on: ${{ needs.changes.outputs.simulator == 'false' && 'ubuntu-latest' || 'xcode-27' }}
    # Fail-safe: `!cancelled()` keeps this required job running even when `changes`
    # failed, and its steps skip only on the exact output 'false' — a failed `changes`
    # leaves the output empty, so everything runs. A job skipped outright would report
    # as passing.
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.simulator != 'false'
        with:
          persist-credentials: false

      - uses: ./.github/actions/select-xcode
        if: needs.changes.outputs.simulator != 'false'

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: needs.changes.outputs.simulator != 'false'

      # Starts the cold boot (~70 s, mostly data migration) without waiting for it, so
      # it overlaps the build; the later `bootstatus -b` waits then return at once.
      # Same device the recipes pick; a device already booted is left as it is.
      - name: Boot the simulator in the background
        if: needs.changes.outputs.simulator != 'false'
        run: |
          udid="$(scripts/simulator-destination.sh --udid)"
          devices="$(xcrun simctl list devices)"
          line="$(grep -F -- "${udid}" <<<"${devices}")"
          if [[ "${line}" == *"(Booted)"* ]]; then
            echo "Simulator ${udid} is already booted."
          else
            xcrun simctl boot "${udid}"
          fi

      - name: Smoke launch (Release)
        if: needs.changes.outputs.simulator != 'false'
        run: just smoke

      # smoke_launch.sh writes no result bundle: what is left after a failure is the
      # Release build's logs and, for a crash, the simulator app's crash report.
      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-logs
          path: |
            build/smoke-derived-data/Logs
            ~/Library/Logs/DiagnosticReports/*.ips
          if-no-files-found: ignore
          retention-days: 7

  ios-tests:
    name: Package Tests (iOS Simulator)
    # A pull request with nothing for this job to do skips every step, so it takes a
    # cheap Ubuntu runner instead of waiting for a macOS one; any other output
    # (true, or empty after a failed `changes`) keeps macOS.
    runs-on: ${{ needs.changes.outputs.simulator == 'false' && 'ubuntu-latest' || 'xcode-27' }}
    # Fail-safe: `!cancelled()` keeps this required job running even when `changes`
    # failed, and its steps skip only on the exact output 'false' — a failed `changes`
    # leaves the output empty, so everything runs. A job skipped outright would report
    # as passing.
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.simulator != 'false'
        with:
          persist-credentials: false

      - uses: ./.github/actions/select-xcode
        if: needs.changes.outputs.simulator != 'false'

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: needs.changes.outputs.simulator != 'false'

      # Starts the cold boot (~70 s, mostly data migration) without waiting for it, so
      # it overlaps the build; the later `bootstatus -b` waits then return at once.
      # Same device the recipes pick; a device already booted is left as it is.
      - name: Boot the simulator in the background
        if: needs.changes.outputs.simulator != 'false'
        run: |
          udid="$(scripts/simulator-destination.sh --udid)"
          devices="$(xcrun simctl list devices)"
          line="$(grep -F -- "${udid}" <<<"${devices}")"
          if [[ "${line}" == *"(Booted)"* ]]; then
            echo "Simulator ${udid} is already booted."
          else
            xcrun simctl boot "${udid}"
          fi

      - name: Run the package tests on an iOS Simulator
        if: needs.changes.outputs.simulator != 'false'
        run: just test-ios

      - name: Upload result bundles on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcresult-bundles-ios-tests
          path: build/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  zizmor:
    name: Workflow Security Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Plain annotations instead of SARIF upload — keeps permissions read-only.
          advanced-security: false
