# XcodeGen manifest — the SOURCE OF TRUTH for the app target.
# FlashCompose.xcodeproj is generated (`just generate`) and gitignored; never hand-edit it.
name: FlashCompose
options:
  bundleIdPrefix: io.github.tomada1114
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
packages:
  FlashComposeKit:
    path: Packages/FlashComposeKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FlashCompose:
    type: application
    platform: iOS
    sources: [App]
    # Debug reads Config/Debug.xcconfig, which optionally includes the gitignored
    # Config/Local.xcconfig holding DEVELOPMENT_TEAM for `just run-device`. Never set
    # DEVELOPMENT_TEAM below, even empty: a target's own setting overrides its xcconfig.
    configFiles:
      Debug: Config/Debug.xcconfig
    dependencies:
      - package: FlashComposeKit
        product: FlashComposeUI
      # The app shell is the composition root: it is the only target that links the
      # adapters (FlashComposePlatform) and hands them to Core view models as ports.
      - package: FlashComposeKit
        product: FlashComposePlatform
    # XcodeGen writes App/Info.plist from these properties on every `just generate`, and
    # the build merges it with the INFOPLIST_KEY_* settings below. The URL scheme is
    # DeepLink.scheme in FlashComposeCore; DeepLinkTests fails when the two differ.
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: io.github.tomada1114.FlashCompose
            CFBundleURLSchemes: [flash-compose]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tomada1114.FlashCompose
        GENERATE_INFOPLIST_FILE: YES
        # iPhone only, portrait: the design lock adds no iPad layout (docs/design-system.md).
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Simulator builds sign ad hoc and need no team. A device build takes its
        # DEVELOPMENT_TEAM from Config/Debug.xcconfig's optional Local.xcconfig
        # (docs/running-on-device.md), never from this file.
        CODE_SIGN_STYLE: Automatic
  FlashComposeLaunchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LaunchUITests]
    dependencies:
      - target: FlashCompose
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  FlashCompose:
    build:
      targets: { FlashCompose: all }
    test:
      targets: [FlashComposeLaunchUITests]
